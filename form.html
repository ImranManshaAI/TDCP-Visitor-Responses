<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDCP Office Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233F;
    --navy-deep:#0E1830;
    --gold:#E8A33D;
    --rose:#C6427E;
    --teal:#2F6E68;
    --paper:#F7F2E7;
    --ink:#1E1B16;
    --line: rgba(30,27,22,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  .banner{
    background:var(--navy);
    color:var(--paper);
    padding:40px 20px 56px;
    position:relative;
    overflow:hidden;
  }
  .banner::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:0.35;
  }
  .banner-inner{max-width:760px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(30px, 5vw, 42px);
    line-height:1.05;
    margin:0 0 12px;
  }
  .sub{
    font-size:14.5px;
    color:rgba(247,242,231,0.75);
    max-width:52ch;
    line-height:1.5;
    margin:0;
  }

  .card{
    background:#fff;
    margin-top:-32px;
    border-radius:18px;
    padding:34px 28px;
    box-shadow:0 24px 48px -20px rgba(14,24,48,0.25);
  }

  .section-label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 14px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .card > .section-label:first-child{border-top:none;padding-top:0;}

  .field{margin-bottom:20px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:560px){.row2,.row3{grid-template-columns:1fr;}}

  label{
    display:block;
    font-size:12px;
    font-family:'Space Mono', monospace;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--navy);
    margin-bottom:7px;
  }
  label .req{color:var(--rose);}
  label .opt{color:rgba(30,27,22,0.4);text-transform:none;font-family:'Work Sans',sans-serif;font-size:11px;}
  input, select, textarea{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--teal);
    background:#fff;
  }
  textarea{resize:vertical;min-height:80px;}

  /* Sites checkbox grid */
  .sites-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media(max-width:560px){.sites-grid{grid-template-columns:1fr;}}
  .site-opt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .site-opt:has(input:checked){
    border-color:var(--rose);
    background:#fff;
  }
  .site-opt input{width:auto;accent-color:var(--rose);}
  .site-opt span{font-size:14.5px;}
  .hint{font-size:12px;color:rgba(30,27,22,0.45);margin-top:8px;}
  .hint.err{color:var(--rose);}

  /* Toggle for additional service */
  .toggle-group{display:flex;gap:10px;}
  .toggle-opt{
    flex:1;
    text-align:center;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    background:var(--paper);
    transition:border-color .12s ease, background .12s ease;
    user-select:none;
  }
  .toggle-opt.active{
    border-color:var(--teal);
    background:#fff;
    color:var(--teal);
  }
  #serviceDetailsField{display:none;margin-top:16px;}

  button{
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--navy);
    color:#fff;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{background:var(--navy-deep);}
  button:active{transform:scale(0.99);}
  button:disabled{opacity:0.6;cursor:not-allowed;}

  .status{
    margin-top:16px;
    font-size:14px;
    padding:12px 14px;
    border-radius:10px;
    display:none;
  }
  .status.ok{display:block;background:rgba(47,110,104,0.12);color:var(--teal);}
  .status.err{display:block;background:rgba(198,66,126,0.12);color:var(--rose);}
</style>
</head>
<body>

<div class="banner">
  <div class="banner-inner">
    <p class="eyebrow">TDCP · Office Use Only</p>
    <h1>Visitor Intake — Bus Tour Desk</h1>
    <p class="sub">Fill this in while assisting a walk-in visitor at the counter.</p>
  </div>
</div>

<div class="wrap">
  <form class="card" id="intakeForm">

    <p class="section-label">Visit Details</p>
    <div class="row2">
      <div class="field">
        <label>Date of Office Visit <span class="req">*</span></label>
        <input type="date" name="officeVisitDate" id="officeVisitDate" required>
      </div>
      <div class="field">
        <label>Preferred Tour Date <span class="req">*</span></label>
        <input type="date" name="preferredDate" required>
      </div>
    </div>

    <p class="section-label">Visitor Details</p>
    <div class="row2">
      <div class="field">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" name="name" required placeholder="Visitor's name">
      </div>
      <div class="field">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" name="contact" required placeholder="03XX-XXXXXXX">
      </div>
    </div>
    <div class="row3">
      <div class="field">
        <label>Group Size <span class="req">*</span></label>
        <input type="number" name="groupSize" min="1" required placeholder="e.g. 4">
      </div>
      <div class="field">
        <label>City of Origin <span class="req">*</span></label>
        <input type="text" name="origin" required placeholder="e.g. Multan">
      </div>
      <div class="field">
        <label>Email <span class="opt">(optional)</span></label>
        <input type="email" name="email" placeholder="visitor@example.com">
      </div>
    </div>
    <div class="field">
      <label>CNIC <span class="opt">(optional)</span></label>
      <input type="text" name="idNumber" placeholder="XXXXX-XXXXXXX-X">
    </div>

    <p class="section-label">Sites to Visit</p>
    <div class="field">
      <label>Select at least one <span class="req">*</span></label>
      <div class="sites-grid" id="sitesGrid">
        <label class="site-opt"><input type="checkbox" name="sites" value="Bahawalpur Zoo"><span>Bahawalpur Zoo</span></label>
        <label class="site-opt"><input type="checkbox" name="sites" value="Bahawalpur Library & Museum"><span>Bahawalpur Library &amp; Museum</span></label>
        <label class="site-opt"><input type="checkbox" name="sites" value="Noor Mehal"><span>Noor Mehal</span></label>
        <label class="site-opt"><input type="checkbox" name="sites" value="SS World Park"><span>SS World Park</span></label>
        <label class="site-opt"><input type="checkbox" name="sites" value="DHA Park"><span>DHA Park</span></label>
      </div>
      <p class="hint" id="sitesHint">Tap all sites the visitor plans to cover on the bus tour.</p>
    </div>

    <p class="section-label">Additional Service</p>
    <div class="field">
      <label>Any additional service provided / requested? <span class="req">*</span></label>
      <div class="toggle-group" id="serviceToggle">
        <div class="toggle-opt" data-value="No">No</div>
        <div class="toggle-opt" data-value="Yes">Yes</div>
      </div>
      <div id="serviceDetailsField">
        <label style="margin-top:16px;">Service Details</label>
        <textarea name="additionalServiceDetails" placeholder="e.g. wheelchair assistance, private guide, extra drop-off point..."></textarea>
      </div>
    </div>

    <p class="section-label">Notes</p>
    <div class="field">
      <label>Remarks / Info Provided to Visitor</label>
      <textarea name="remarks" placeholder="What was explained to the visitor, any special requests, follow-ups needed..."></textarea>
    </div>

    <button type="submit" id="submitBtn">Save Entry</button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script>
  // ⚠️ Replace with your deployed Apps Script Web App URL (see SETUP_GUIDE.md)
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzgTvAq7nNLCltE0OJcYk0HlaEO7uwsyBca643BdVNiwmkQQn7rcmpRc80K8_TK3j7r/exec";

  const form = document.getElementById('intakeForm');
  const statusBox = document.getElementById('statusBox');
  const submitBtn = document.getElementById('submitBtn');
  const sitesHint = document.getElementById('sitesHint');
  const serviceToggle = document.getElementById('serviceToggle');
  const serviceDetailsField = document.getElementById('serviceDetailsField');
  let additionalService = 'No';

  // Default office visit date = today
  document.getElementById('officeVisitDate').valueAsDate = new Date();

  serviceToggle.addEventListener('click', (e) => {
    const opt = e.target.closest('.toggle-opt');
    if (!opt) return;
    [...serviceToggle.children].forEach(c => c.classList.remove('active'));
    opt.classList.add('active');
    additionalService = opt.dataset.value;
    serviceDetailsField.style.display = additionalService === 'Yes' ? 'block' : 'none';
  });
  // default to "No" selected
  serviceToggle.children[0].classList.add('active');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.className = 'status';
    statusBox.textContent = '';

    const checkedSites = [...form.querySelectorAll('input[name="sites"]:checked')].map(c => c.value);
    if (checkedSites.length === 0) {
      sitesHint.classList.add('err');
      sitesHint.textContent = 'Please select at least one site.';
      return;
    } else {
      sitesHint.classList.remove('err');
      sitesHint.textContent = 'Tap all sites the visitor plans to cover on the bus tour.';
    }

    if (ENDPOINT_URL.includes('PASTE_YOUR')) {
      statusBox.className = 'status err';
      statusBox.textContent = 'Backend URL not configured yet — see SETUP_GUIDE.md.';
      return;
    }

    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    payload.sites = checkedSites;
    payload.additionalService = additionalService;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    try {
      await fetch(ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors', // Apps Script doesn't echo CORS headers on POST; no-cors avoids the browser blocking the request
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      statusBox.className = 'status ok';
      statusBox.textContent = 'Saved. Entry recorded successfully.';
      form.reset();
      document.getElementById('officeVisitDate').valueAsDate = new Date();
      [...serviceToggle.children].forEach(c => c.classList.remove('active'));
      serviceToggle.children[0].classList.add('active');
      additionalService = 'No';
      serviceDetailsField.style.display = 'none';
    } catch (err) {
      statusBox.className = 'status err';
      statusBox.textContent = 'Something went wrong. Please try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save Entry';
    }
  });
</script>

</body>
</html>
