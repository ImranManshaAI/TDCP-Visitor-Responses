<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDCP Visitor Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#16233F;
    --navy-deep:#0E1830;
    --gold:#E8A33D;
    --rose:#C6427E;
    --teal:#2F6E68;
    --paper:#F7F2E7;
    --ink:#1E1B16;
    --line: rgba(30,27,22,0.12);
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
  }
  .topbar{
    background:var(--navy);
    color:var(--paper);
    padding:28px 24px;
  }
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .eyebrow{font-family:'Space Mono', monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  h1{font-family:'Fraunces', serif;font-weight:600;font-size:30px;margin:0;}
  .refresh-btn{
    background:rgba(247,242,231,0.1);
    border:1px solid rgba(247,242,231,0.3);
    color:var(--paper);
    padding:9px 16px;
    border-radius:8px;
    font-family:'Work Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .refresh-btn:hover{background:rgba(247,242,231,0.18);}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{
    background:var(--card);
    border-radius:14px;
    padding:20px;
    border:1px solid var(--line);
  }
  .kpi .label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(30,27,22,0.5);margin-bottom:8px;}
  .kpi .value{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--navy);}
  .kpi .value.accent{color:var(--rose);}

  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--card);
    border-radius:14px;
    padding:22px;
    border:1px solid var(--line);
  }
  .panel h2{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 16px;
    color:var(--navy);
  }
  .chart-wrap{position:relative;height:260px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:rgba(30,27,22,0.5);
    padding:8px 10px;
    border-bottom:1.5px solid var(--line);
  }
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .pill{
    display:inline-block;
    font-size:11px;
    padding:3px 9px;
    border-radius:20px;
    font-family:'Space Mono',monospace;
  }
  .pill.yes{background:rgba(232,163,61,0.16);color:#8a5a15;}
  .pill.no{background:rgba(30,27,22,0.07);color:rgba(30,27,22,0.5);}
  .sites-cell{white-space:pre-line;font-size:12.5px;color:rgba(30,27,22,0.75);}

  .empty, .loading, .error{
    text-align:center;
    padding:60px 20px;
    color:rgba(30,27,22,0.5);
    font-size:14px;
  }
  .error{color:var(--rose);}
  code{background:rgba(30,27,22,0.06);padding:2px 6px;border-radius:4px;font-size:12.5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <p class="eyebrow">TDCP · Internal Analytics</p>
      <h1>Visitor Intake Dashboard</h1>
    </div>
    <button class="refresh-btn" onclick="loadData()">Refresh Data</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="loading">Loading visitor data…</div>
</div>

<script>
  // ⚠️ Replace with your deployed Apps Script Web App URL (see SETUP_GUIDE.md)
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzgTvAq7nNLCltE0OJcYk0HlaEO7uwsyBca643BdVNiwmkQQn7rcmpRc80K8_TK3j7r/exec";

  const charts = {};

  async function loadData() {
    const app = document.getElementById('app');
    app.innerHTML = '<div class="loading">Loading visitor data…</div>';

    if (ENDPOINT_URL.includes('PASTE_YOUR')) {
      app.innerHTML = '<div class="error">Backend URL not configured yet.<br>Paste your Apps Script Web App URL into <code>ENDPOINT_URL</code> — see SETUP_GUIDE.md.</div>';
      return;
    }

    try {
      const res = await fetch(ENDPOINT_URL);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error(data.message || 'Unexpected response');
      render(data);
    } catch (err) {
      app.innerHTML = `<div class="error">Couldn't load data: ${err.message}</div>`;
    }
  }

  // "Sites Selected" cells look like "1. Bahawalpur Zoo\n2. Noor Mehal" — split back into a clean array
  function parseSites(cell) {
    if (!cell) return [];
    return String(cell)
      .split('\n')
      .map(line => line.replace(/^\d+\.\s*/, '').trim())
      .filter(Boolean);
  }

  function render(rows) {
    const app = document.getElementById('app');

    if (rows.length === 0) {
      app.innerHTML = '<div class="empty">No entries yet. Once staff start logging walk-in visitors, insights will appear here.</div>';
      return;
    }

    // --- KPIs ---
    const total = rows.length;
    const totalVisitors = rows.reduce((s, r) => s + (Number(r['Group Size']) || 0), 0);
    const uniqueCities = new Set(rows.map(r => r['Origin City']).filter(Boolean)).size;
    const serviceRequests = rows.filter(r => String(r['Additional Service']).toLowerCase() === 'yes').length;

    // --- Aggregations ---
    const bySite = {};
    rows.forEach(r => {
      parseSites(r['Sites Selected']).forEach(s => { bySite[s] = (bySite[s] || 0) + 1; });
    });
    const siteEntries = Object.entries(bySite).sort((a,b) => b[1]-a[1]);

    const byCity = {};
    rows.forEach(r => {
      const c = r['Origin City'] || 'Unspecified';
      byCity[c] = (byCity[c] || 0) + 1;
    });
    const cityEntries = Object.entries(byCity).sort((a,b) => b[1]-a[1]).slice(0, 8);

    const byDate = {};
    rows.forEach(r => {
      const d = new Date(r['Office Visit Date']);
      if (isNaN(d)) return;
      const key = d.toISOString().slice(0,10);
      byDate[key] = (byDate[key] || 0) + 1;
    });
    const dateEntries = Object.entries(byDate).sort((a,b) => a[0].localeCompare(b[0]));

    const recent = [...rows].reverse().slice(0, 8);

    app.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="label">Total Entries</div><div class="value">${total}</div></div>
        <div class="kpi"><div class="label">Total Visitors (Group Size)</div><div class="value accent">${totalVisitors}</div></div>
        <div class="kpi"><div class="label">Origin Cities</div><div class="value">${uniqueCities}</div></div>
        <div class="kpi"><div class="label">Additional Service Requests</div><div class="value">${serviceRequests}</div></div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Office Visits Over Time</h2>
          <div class="chart-wrap"><canvas id="timeChart"></canvas></div>
        </div>
        <div class="panel">
          <h2>Top Origin Cities</h2>
          <div class="chart-wrap"><canvas id="cityChart"></canvas></div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Site Popularity</h2>
          <div class="chart-wrap"><canvas id="siteChart"></canvas></div>
        </div>
        <div class="panel">
          <h2>Recent Entries</h2>
          <table>
            <thead><tr><th>#</th><th>Visitor</th><th>Sites</th><th>Extra Svc</th></tr></thead>
            <tbody>
              ${recent.map(r => `
                <tr>
                  <td>${escapeHtml(r['S.No'] ?? '—')}</td>
                  <td>${escapeHtml(r.Name || '—')}<br><span style="color:rgba(30,27,22,0.45);font-size:11.5px;">${escapeHtml(r['Origin City'] || '')}</span></td>
                  <td class="sites-cell">${escapeHtml(r['Sites Selected'] || '—')}</td>
                  <td><span class="pill ${String(r['Additional Service']).toLowerCase()==='yes' ? 'yes':'no'}">${escapeHtml(r['Additional Service'] || 'No')}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

    drawCharts(dateEntries, cityEntries, siteEntries);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function drawCharts(dateEntries, cityEntries, siteEntries) {
    Object.values(charts).forEach(c => c && c.destroy());

    const navy = '#16233F', gold = '#E8A33D', rose = '#C6427E', teal = '#2F6E68';

    charts.time = new Chart(document.getElementById('timeChart'), {
      type: 'line',
      data: {
        labels: dateEntries.map(e => e[0]),
        datasets: [{
          data: dateEntries.map(e => e[1]),
          borderColor: teal,
          backgroundColor: 'rgba(47,110,104,0.12)',
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: teal
        }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ y:{ beginAtZero:true, ticks:{precision:0} } }
      }
    });

    charts.city = new Chart(document.getElementById('cityChart'), {
      type: 'doughnut',
      data: {
        labels: cityEntries.map(e => e[0]),
        datasets: [{
          data: cityEntries.map(e => e[1]),
          backgroundColor: [navy, rose, gold, teal, '#7FA88F', '#D97757', '#8a5a9c', '#4a6fa5'],
          borderWidth: 0
        }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:10.5} } } }
      }
    });

    charts.site = new Chart(document.getElementById('siteChart'), {
      type: 'bar',
      data: {
        labels: siteEntries.map(e => e[0]),
        datasets: [{
          data: siteEntries.map(e => e[1]),
          backgroundColor: navy,
          borderRadius: 6,
          maxBarThickness: 34
        }]
      },
      options: {
        indexAxis: 'y',
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{ x:{ beginAtZero:true, ticks:{precision:0} } }
      }
    });
  }

  loadData();
</script>

</body>
</html>
